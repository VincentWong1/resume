<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Harness Engineering Architecture</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #fff;
    font-family: -apple-system, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif;
  }
</style>
</head>
<body>
<svg width="900" height="520" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="topHalf">
      <rect x="0" y="0" width="900" height="460"/>
    </clipPath>
  </defs>

  <!-- Layer 3: Add-on Harness (outermost ring) -->
  <g clip-path="url(#topHalf)">
    <ellipse cx="450" cy="460" rx="420" ry="420" fill="#ECEFF1" stroke="#B0BEC5" stroke-width="1.5"/>
    <!-- Layer 2: Build-in Harness (middle ring) -->
    <ellipse cx="450" cy="460" rx="280" ry="280" fill="#CFD8DC" stroke="#90A4AE" stroke-width="1.5"/>
    <!-- Layer 1: LLM (inner core) -->
    <ellipse cx="450" cy="460" rx="120" ry="120" fill="#37474F" stroke="#263238" stroke-width="2"/>
  </g>

  <!-- Baseline -->
  <line x1="28" y1="460" x2="872" y2="460" stroke="#90A4AE" stroke-width="1.5"/>

  <!-- LLM label -->
  <text x="450" y="420" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff" font-family="-apple-system, Helvetica Neue, Arial, sans-serif" letter-spacing="3">LLM</text>

  <!-- Build-in Harness labels (middle band: r=120~280, cy=460) -->
  <!-- At y=230, outer r=280: x_range = 450±sqrt(280²-230²) = 450±161 => 289~611 -->
  <text x="450" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#263238" font-family="-apple-system, Helvetica Neue, Arial, sans-serif">Build-in Harness</text>
  <text x="450" y="248" text-anchor="middle" font-size="11" fill="#78909C" font-family="-apple-system, Helvetica Neue, Arial, sans-serif">(Runtime Execution)</text>

  <!-- Build-in items: 2 rows with bordered tags -->
  <!-- Row 1 -->
  <rect x="290" y="268" width="120" height="22" rx="4" fill="white" stroke="#90A4AE" stroke-width="1"/>
  <text x="350" y="283" text-anchor="middle" font-size="10" fill="#455A64" font-family="-apple-system, Helvetica Neue, Arial, sans-serif">Tool Orchestration</text>

  <rect x="425" y="268" width="140" height="22" rx="4" fill="white" stroke="#90A4AE" stroke-width="1"/>
  <text x="495" y="283" text-anchor="middle" font-size="10" fill="#455A64" font-family="-apple-system, Helvetica Neue, Arial, sans-serif">Memory & State Mgmt</text>

  <!-- Row 2 -->
  <rect x="260" y="298" width="168" height="22" rx="4" fill="white" stroke="#90A4AE" stroke-width="1"/>
  <text x="344" y="313" text-anchor="middle" font-size="10" fill="#455A64" font-family="-apple-system, Helvetica Neue, Arial, sans-serif">Planning & Decomposition</text>

  <rect x="443" y="298" width="155" height="22" rx="4" fill="white" stroke="#90A4AE" stroke-width="1"/>
  <text x="520" y="313" text-anchor="middle" font-size="10" fill="#455A64" font-family="-apple-system, Helvetica Neue, Arial, sans-serif">Verification & Guardrail</text>

  <!-- Add-on Harness labels (outer band: r=280~420, cy=460) -->
  <!-- At y=90, outer r=420: x_range=450±sqrt(420²-370²)=450±198=252~648 -->
  <text x="450" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#263238" font-family="-apple-system, Helvetica Neue, Arial, sans-serif">Add-on Harness</text>
  <text x="450" y="108" text-anchor="middle" font-size="11" fill="#78909C" font-family="-apple-system, Helvetica Neue, Arial, sans-serif">(Context Engineering)</text>

  <!-- Add-on items: placed around y=155, outer r=420: x_range=450±sqrt(420²-305²)=450±289=161~739 -->
  <!-- inner r=280: x_range=450±sqrt(280²-305²) => negative, no inner constraint -->
  <!-- 5 items in 2 rows to avoid overlap -->
  <!-- Row 1: 3 items -->
  <rect x="245" y="132" width="120" height="22" rx="4" fill="white" stroke="#B0BEC5" stroke-width="1"/>
  <text x="305" y="147" text-anchor="middle" font-size="10" fill="#455A64" font-family="-apple-system, Helvetica Neue, Arial, sans-serif">Skills &amp; Knowledge</text>

  <rect x="380" y="132" width="135" height="22" rx="4" fill="white" stroke="#B0BEC5" stroke-width="1"/>
  <text x="447" y="147" text-anchor="middle" font-size="10" fill="#455A64" font-family="-apple-system, Helvetica Neue, Arial, sans-serif">Middleware &amp; Hooks</text>

  <rect x="530" y="132" width="110" height="22" rx="4" fill="white" stroke="#B0BEC5" stroke-width="1"/>
  <text x="585" y="147" text-anchor="middle" font-size="10" fill="#455A64" font-family="-apple-system, Helvetica Neue, Arial, sans-serif">Tool Definitions</text>

  <!-- Row 2: 2 items -->
  <rect x="290" y="162" width="80" height="22" rx="4" fill="white" stroke="#B0BEC5" stroke-width="1"/>
  <text x="330" y="177" text-anchor="middle" font-size="10" fill="#455A64" font-family="-apple-system, Helvetica Neue, Arial, sans-serif">Few-shots</text>

  <rect x="500" y="162" width="90" height="22" rx="4" fill="white" stroke="#B0BEC5" stroke-width="1"/>
  <text x="545" y="177" text-anchor="middle" font-size="10" fill="#455A64" font-family="-apple-system, Helvetica Neue, Arial, sans-serif">Role &amp; Tone</text>

  <!-- Title -->
  <text x="450" y="505" text-anchor="middle" font-size="14" fill="#90A4AE" font-family="-apple-system, Helvetica Neue, Arial, sans-serif" font-style="italic">Harness Engineering — Concentric Architecture</text>
</svg>
</body>
</html>
